# Mount-equipment set bonuses, mirrored from the client libconfig SetItemInfo table.
#
# A set's effect activates once every one of its itemTids is equipped at once.
# equipEffect:
#   1 - [Magic Battle] Increased critical spell chance
#   2 - [Magic Battle] Passive gauge fills faster
#   3 - [Magic Battle] Gauge fills while holding a spell
# The magnitude of each effect is tuned globally in magic.yaml (setBonus section);
# equipEffectValue is carried through from the client table (0 = use the global magnitude).
collection:
  - setId: 1
    name: 'Elite Knight Set'
    description: '[Magic Battle] Increased critical spell chance'
    itemTids: [20028, 20029, 20030, 20031]
    equipEffect: 1
    equipEffectValue: 0

