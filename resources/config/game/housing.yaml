# Housing definitions from HousingInfo.
#
# category is the ranch slot the housing occupies; a ranch holds one housing per
# category, 13 in total (0-12). Observed from the client mesh names:
#   0 house  1 stable  2 fence  3 ground  4-5 small deco  6 medium deco
#   7 large deco  8-10 yard deco  11 tree/rock  12 incubator
#
# property is the owning faction, from HousingPropertyInfo:
#   0 none  1 Crystal Knights  2 Stato Trading Company  3 Alicia Riding Club
#
# lifetime is the client's Life column: 28800 for everything buildable, 0 for the
# defaults and incubators. The unit is unconfirmed - 8 hours if it is seconds,
# but it may be a decaying durability instead. Nothing reads it yet; the build
# handler still uses its own 20 day expiry.
# value/value2/value3 are only used by the incubators (id 51, 52):
#   value  - egg slots the incubator provides
#   value2 - hatches granted per build; 0 means it never runs out, which is how
#            the level 1 incubator (id 51) works
#   value3 - the most uses it can hold; rebuilding tops up by value2 and stops
#            here, so the double incubator caps at 20
# Incubators never expire - they are spent by hatching instead.
housing:
  - id: 1
    # ran_la01_h_01
    category: 0
    property: 0
    isDefault: true
    isBasic: false
    minLevel: 1
    lifetime: 0
    buildResources: []
    buildExp: 0
    regularExp: 0
    regularMoney: 0
