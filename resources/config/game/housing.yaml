# Housing sets from HousingSetInfo. Owning every housing in a set grants the set
# bonus. The client's set description states a 50% increase to the ranch regular
# bonus; there is no dedicated field for it, so the rate is configured here.
housingSets:
  - id: 1
    regularBonusPercent: 50
    housingIds: [21, 22, 23, 24, 25, 26, 27, 28, 29]
  - id: 2
    regularBonusPercent: 50
    housingIds: [31, 32, 33, 34, 35, 36, 37, 38, 39]
  - id: 3
    regularBonusPercent: 50
    housingIds: [41, 42, 43, 44, 45, 46, 47, 48, 49]

